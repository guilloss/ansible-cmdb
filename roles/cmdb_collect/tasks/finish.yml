---
# ---------------------------------------------------------------------------
# Fin de passage : manifeste (statut de chaque hôte, y compris injoignables),
# lot transférable optionnel, puis échec visible des hôtes non collectés.
#   <cmdb_store>/_runs/<run_id>/_run.json                  en-tête du passage
#   <cmdb_store>/_runs/<run_id>/<app>__<pf>__<hôte>.json   statut par hôte
#   <cmdb_store>/_lots/<app>__<pf>__<run_id>.tar.gz        si cmdb_lot=true
#   <cmdb_store>/_lots/<run_id>.tar.gz                     même lot, nom d'origine (lien dur)
# ---------------------------------------------------------------------------

- name: Créer le répertoire du manifeste
  ansible.builtin.file:
    path: "{{ cmdb_store_dir }}/_runs/{{ cmdb_run_id }}"
    state: directory
    mode: "0750"
  run_once: true
  delegate_to: localhost
  become: false

- name: Statut de l'hôte dans le manifeste
  ansible.builtin.copy:
    dest: "{{ cmdb_store_dir }}/_runs/{{ cmdb_run_id }}/{{ cmdb_app }}__{{ cmdb_platform }}__{{ inventory_hostname }}.json"
    content: >-
      {{ {'run_id': cmdb_run_id, 'host': inventory_hostname, 'app': cmdb_app, 'platform': cmdb_platform,
          'status': cmdb_status, 'collector': cmdb_collector_kind | default(None),
          'file': cmdb_result_rel | default(None), 'detail': None if cmdb_status == 'ok' else cmdb_status_detail,
          'tags': cmdb_tags_map | default({})} | to_nice_json }}
    mode: "0640"
  delegate_to: localhost
  become: false

- name: Statut des hôtes injoignables ou en échec avant la collecte
  ansible.builtin.copy:
    dest: >-
      {{ cmdb_store_dir }}/_runs/{{ cmdb_run_id }}/{{ hostvars[item].cmdb_app | default('NA') }}__{{
      hostvars[item].cmdb_platform | default('NA') }}__{{ item }}.json
    content: >-
      {{ {'run_id': cmdb_run_id, 'host': item, 'app': hostvars[item].cmdb_app | default(None),
          'platform': hostvars[item].cmdb_platform | default(None),
          'status': 'failed' if (hostvars[item].cmdb_status | default('')) == 'pending'
                    else ('invalid_tags' if (hostvars[item].cmdb_status | default('')) == 'invalid_tags' else 'unreachable'),
          'collector': None, 'file': None,
          'detail': hostvars[item].cmdb_status_detail | default('injoignable, ou échec avant la collecte (connexion, faits Ansible)')}
         | to_nice_json }}
    mode: "0640"
  loop: "{{ ansible_play_hosts_all | difference(ansible_play_hosts) }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: En-tête du manifeste
  ansible.builtin.copy:
    dest: "{{ cmdb_store_dir }}/_runs/{{ cmdb_run_id }}/_run.json"
    content: >-
      {{ {'run_id': cmdb_run_id, 'started_at': cmdb_run_started,
          'finished_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'), 'play': ansible_play_name,
          'controller_user': lookup('ansible.builtin.env', 'USER') | default(None),
          'limit': ansible_limit | default(None), 'hosts_total': ansible_play_hosts_all | length,
          'hosts_ok': ansible_play_hosts | map('extract', hostvars, 'cmdb_status') | select('equalto', 'ok') | list | length}
         | to_nice_json }}
    mode: "0640"
  run_once: true
  delegate_to: localhost
  become: false

- name: Constituer le lot transférable du passage
  when: cmdb_lot | bool
  run_once: true
  delegate_to: localhost
  become: false
  block:
    - name: Créer le répertoire des lots
      ansible.builtin.file:
        path: "{{ cmdb_store_dir }}/_lots"
        state: directory
        mode: "0750"

    # Nom du lot : applications et plates-formes du passage, puis run_id. Plusieurs valeurs sont
    # jointes par « + » (au plus 3, sinon « multi »).
    - name: Vérifier le nom imposé du lot
      ansible.builtin.assert:
        that: cmdb_lot_name | trim is match('^[A-Za-z0-9][A-Za-z0-9._+-]{0,200}$')
        fail_msg: "cmdb_lot_name invalide : lettres, chiffres, . _ + - seulement, sans répertoire ni .tar.gz"
        quiet: true
      when: cmdb_lot_name | trim | length > 0

    - name: Nommer le lot
      ansible.builtin.set_fact:
        cmdb_lot_path: >-
          {{ cmdb_store_dir ~ '/_lots/' ~ ((cmdb_lot_name | trim) if (cmdb_lot_name | trim)
             else (_apps ~ '__' ~ _pfs ~ '__' ~ cmdb_run_id)) ~ '.tar.gz' }}
      vars:
        _hosts: "{{ ansible_play_hosts_all | map('extract', hostvars) | list }}"
        _app_list: >-
          {{ _hosts | selectattr('cmdb_app', 'defined') | map(attribute='cmdb_app') | map('string')
             | select('match', cmdb_tag_regex) | unique | sort }}
        _pf_list: >-
          {{ _hosts | selectattr('cmdb_platform', 'defined') | map(attribute='cmdb_platform') | map('string')
             | select('match', cmdb_tag_regex) | unique | sort }}
        _apps: "{{ 'NA' if not _app_list else ('multi' if _app_list | length > 3 else _app_list | join('+')) }}"
        _pfs: "{{ 'NA' if not _pf_list else ('multi' if _pf_list | length > 3 else _pf_list | join('+')) }}"

    - name: Archiver les collectes et le manifeste du passage
      ansible.builtin.command:
        argv: >-
          {{ ['tar', '-czf', cmdb_lot_path, '-C', cmdb_store_dir, '_runs/' ~ cmdb_run_id]
             + (ansible_play_hosts | map('extract', hostvars, 'cmdb_lot_files') | flatten | list) }}
      changed_when: true

    # Nom d'origine conservé (même fichier, sans place en plus) pour les procédures déjà écrites
    - name: Garder aussi le nom d'origine du lot
      ansible.builtin.file:
        src: "{{ cmdb_lot_path }}"
        dest: "{{ cmdb_store_dir }}/_lots/{{ cmdb_run_id }}.tar.gz"
        state: hard
        force: true
      when:
        - cmdb_lot_keep_run_id_name | bool
        - cmdb_lot_path != cmdb_store_dir ~ '/_lots/' ~ cmdb_run_id ~ '.tar.gz'

    - name: Lot prêt
      ansible.builtin.debug:
        msg: "Lot à transférer : {{ cmdb_lot_path }}"

- name: Signaler les collectes en échec
  ansible.builtin.fail:
    msg: "Collecte CMDB en échec sur {{ inventory_hostname }} : {{ cmdb_status_detail }}"
  when: cmdb_status != 'ok'
