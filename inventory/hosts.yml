# Exemple d'inventaire — à remplacer par votre inventaire réel (statique ou dynamique).
# La collecte se fait SANS élévation de privilèges, sous le compte "ansible_user" :
# un compte dédié, non privilégié, présent sur chaque serveur.
#
#   collect.yml        : hôtes "modernes" (Python >= 3.7 avec ansible-core récent)
#   collect_legacy.yml : groupes "legacy" et "aix" (aucun module Ansible exécuté sur la cible)
#
# Étiquetage obligatoire de chaque passage : application et plate-forme.
# Soit par -e (-e cmdb_app=APPDEMO -e cmdb_platform=prod), soit ici, par exemple
# un inventaire par application et plate-forme portant ces deux variables dans "all: vars:".
all:
  vars:
    ansible_user: ansible
    cmdb_app: APPDEMO              # exemple : à adapter, ou à fournir par -e
    cmdb_platform: prod
    # cmdb_tags: {site: Paris}    # étiquettes libres facultatives
  children:
    aix:
      # collect_legacy.yml -l aix : collecteur shell sous ksh, sans root
      hosts:
        aixprd01.exemple.test:
    web:
      hosts:
        web01.exemple.test:
        web02.exemple.test:
    bdd:
      hosts:
        pg01.exemple.test:

    legacy:
      children:
        # RHEL/CentOS 6-7, Debian 7-8, SLES 11 : SSH encore compatible avec un client
        # récent, sous réserve des clés RSA (signatures SHA-1)
        legacy_recent:
          hosts:
            app-old01.exemple.test:   # CentOS 7, Python 2.7
            app-old02.exemple.test:   # CentOS 6, Python 2.6
            deb7-01.exemple.test:     # Debian 7, Python 2.7.3
          vars:
            ansible_ssh_common_args: >-
              -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa

        # RHEL/CentOS 4-5, SLES 10, Debian <= 5 : OpenSSH 3.9 à 5.x
        legacy_ancient:
          hosts:
            centos4-01.exemple.test:  # OpenSSH 3.9, sudo 1.6, bash 3.0
            centos5-01.exemple.test:  # OpenSSH 4.3, Python 2.4
          vars:
            # Algorithmes désactivés par défaut dans les clients OpenSSH récents
            ansible_ssh_common_args: >-
              -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1,diffie-hellman-group1-sha1
              -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa
              -o Ciphers=+aes128-cbc,aes256-cbc,3des-cbc
